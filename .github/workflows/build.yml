name: Build Kaleem Viewer APK

# Put this file at: .github/workflows/build.yml
# It generates the whole Android project, builds it, and uploads the APK.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/kotlin/com/kaleem/viewer

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'KaleemViewer'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.kaleem.viewer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.kaleem.viewer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.print:print:1.0.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Kaleem Viewer"
                  android:allowBackup="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="content" android:mimeType="*/*" />
                          <data android:scheme="file" android:mimeType="*/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/kotlin/com/kaleem/viewer/MainActivity.kt <<'EOF'
          package com.kaleem.viewer

          import android.content.ClipData
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.Bundle
          import android.os.CancellationSignal
          import android.os.ParcelFileDescriptor
          import android.print.PageRange
          import android.print.PrintAttributes
          import android.print.PrintDocumentAdapter
          import android.print.PrintDocumentInfo
          import android.print.PrintManager
          import android.provider.OpenableColumns
          import android.text.TextUtils
          import android.view.DragEvent
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.MimeTypeMap
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.pm.ShortcutInfoCompat
          import androidx.core.content.pm.ShortcutManagerCompat
          import androidx.core.graphics.drawable.IconCompat
          import androidx.documentfile.provider.DocumentFile
          import androidx.print.PrintHelper
          import java.io.FileOutputStream

          class MainActivity : AppCompatActivity() {
              private var cur: Uri? = null
              private var mime = "*/*"
              private var name = "file"
              private var edit: EditText? = null
              private var printView: WebView? = null
              private lateinit var box: FrameLayout

              private val pickFile = registerForActivityResult(ActivityResultContracts.OpenDocument()) { u ->
                  if (u != null) { keep(u); open(u) }
              }
              private val pickDir = registerForActivityResult(ActivityResultContracts.OpenDocumentTree()) { u ->
                  if (u != null) { keep(u); DocumentFile.fromTreeUri(this, u)?.let { listDir(it) } }
              }

              private val dropL = View.OnDragListener { _, e ->
                  when (e.action) {
                      DragEvent.ACTION_DRAG_STARTED -> true
                      DragEvent.ACTION_DROP -> {
                          val u = e.clipData?.takeIf { it.itemCount > 0 }?.getItemAt(0)?.uri
                          if (u != null) { requestDragAndDropPermissions(e); open(u) } else toast("Drop a file here")
                          true
                      }
                      else -> true
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  // Permanent app title: part of the layout, no menu/setting can hide it.
                  root.addView(TextView(this).apply {
                      text = "Kaleem Viewer"
                      textSize = 22f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      setBackgroundColor(0xFF1565C0.toInt())
                      gravity = Gravity.CENTER
                      setPadding(0, dp(18), 0, dp(14))
                  })

                  val actions: List<Pair<String, () -> Unit>> = listOf(
                      "Open File" to { pickFile.launch(arrayOf("*/*")) },
                      "Open Folder" to { pickDir.launch(null) },
                      "Save" to { saveText() },
                      "Print / PDF" to { doPrint() },
                      "Share" to { share() },
                      "Open with" to { openWith() },
                      "Add to Home" to { pin() }
                  )
                  val row = LinearLayout(this)
                  actions.forEach { (label, fn) ->
                      row.addView(Button(this).apply { text = label; isAllCaps = false; setOnClickListener { fn() } })
                  }
                  root.addView(HorizontalScrollView(this).apply { addView(row) })

                  box = FrameLayout(this)
                  root.addView(box, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.setOnDragListener(dropL)
                  setContentView(root)

                  val d = intent?.data
                  if (d != null) open(d) else msg("Open a file, choose a folder,\nor drag and drop a file here")
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()

              private fun keep(u: Uri) {
                  try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION) } catch (e: Exception) {}
              }

              private fun msg(s: String) {
                  box.removeAllViews(); edit = null
                  box.addView(TextView(this).apply { text = s; gravity = Gravity.CENTER; textSize = 16f; setPadding(dp(24), dp(24), dp(24), dp(24)) },
                      FrameLayout.LayoutParams(-1, -1))
              }

              private fun queryName(u: Uri): String {
                  val n = try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(c.getColumnIndexOrThrow(OpenableColumns.DISPLAY_NAME)) else null
                      }
                  } catch (e: Exception) { null }
                  return n ?: (u.lastPathSegment ?: "file")
              }

              private fun open(u: Uri) {
                  cur = u
                  name = queryName(u)
                  mime = contentResolver.getType(u) ?: "*/*"
                  if (mime == "*/*" || mime == "application/octet-stream") {
                      mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(name.substringAfterLast('.', "").lowercase()) ?: mime
                  }
                  try {
                      when {
                          mime == "application/pdf" -> showPdf(u)
                          mime.startsWith("image/") -> {
                              box.removeAllViews(); edit = null
                              box.addView(ImageView(this).apply { setImageURI(u); scaleType = ImageView.ScaleType.FIT_CENTER }, FrameLayout.LayoutParams(-1, -1))
                          }
                          mime.startsWith("text/") || mime.contains("json") || mime.contains("xml") -> showText(u)
                          else -> msg("$name\n\nThis file type (Word / Excel / PowerPoint / other) opens in an installed app.\nTap \"Open with\" to view or edit it, or use Share / Add to Home.")
                      }
                  } catch (e: Exception) { msg("Cannot display file: ${e.message}") }
              }

              private fun showText(u: Uri) {
                  val t = contentResolver.openInputStream(u)!!.bufferedReader().use { it.readText() }
                  box.removeAllViews()
                  val e = EditText(this).apply {
                      setText(t); gravity = Gravity.TOP; setBackgroundColor(Color.WHITE)
                      setOnDragListener(dropL)
                  }
                  edit = e
                  box.addView(e, FrameLayout.LayoutParams(-1, -1))
              }

              private fun showPdf(u: Uri) {
                  box.removeAllViews(); edit = null
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  box.addView(ScrollView(this).apply { addView(list) }, FrameLayout.LayoutParams(-1, -1))
                  val w = resources.displayMetrics.widthPixels
                  Thread {
                      try {
                          contentResolver.openFileDescriptor(u, "r")?.use { pfd ->
                              PdfRenderer(pfd).use { r ->
                                  for (i in 0 until minOf(r.pageCount, 200)) {
                                      r.openPage(i).use { p ->
                                          val bmp = Bitmap.createBitmap(w, w * p.height / p.width, Bitmap.Config.ARGB_8888)
                                          bmp.eraseColor(Color.WHITE)
                                          p.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                          runOnUiThread {
                                              list.addView(ImageView(this).apply { setImageBitmap(bmp); setPadding(0, 0, 0, dp(6)) })
                                          }
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) { runOnUiThread { toast("PDF error: ${e.message}") } }
                  }.start()
              }

              private fun listDir(d: DocumentFile) {
                  val items = d.listFiles().sortedWith(compareBy<DocumentFile>({ !it.isDirectory }, { it.name?.lowercase() }))
                  val labels = items.map { (if (it.isDirectory) "📁 " else "📄 ") + it.name }.toTypedArray()
                  AlertDialog.Builder(this).setTitle(d.name ?: "Folder")
                      .setItems(labels) { _, i -> val f = items[i]; if (f.isDirectory) listDir(f) else open(f.uri) }
                      .setNegativeButton("Close", null).show()
              }

              private fun saveText() {
                  val e = edit; val u = cur
                  if (e == null || u == null) return toast("Only text files can be edited and saved here")
                  try {
                      contentResolver.openOutputStream(u, "wt")!!.use { it.write(e.text.toString().toByteArray()) }
                      toast("Saved")
                  } catch (x: Exception) { toast("Cannot save: ${x.message}") }
              }

              private fun doPrint() {
                  val u = cur ?: return toast("Open a file first")
                  val pm = getSystemService(PRINT_SERVICE) as PrintManager
                  when {
                      mime == "application/pdf" -> pm.print(name, PdfAdapter(this, u), null)
                      mime.startsWith("image/") -> PrintHelper(this).printBitmap(name, u)
                      edit != null -> {
                          val wv = WebView(this)
                          printView = wv
                          wv.webViewClient = object : WebViewClient() {
                              override fun onPageFinished(v: WebView, url: String?) {
                                  pm.print(name, v.createPrintDocumentAdapter(name), null)
                              }
                          }
                          wv.loadDataWithBaseURL(null, "<pre style='white-space:pre-wrap'>" + TextUtils.htmlEncode(edit!!.text.toString()) + "</pre>", "text/html", "utf-8", null)
                      }
                      else -> toast("Use \"Open with\" to print this file type from its own app")
                  }
              }

              private fun share() {
                  val u = cur ?: return toast("Open a file first")
                  val i = Intent(Intent.ACTION_SEND).setType(mime).putExtra(Intent.EXTRA_STREAM, u)
                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  i.clipData = ClipData.newRawUri(name, u)
                  startActivity(Intent.createChooser(i, "Share $name"))
              }

              private fun openWith() {
                  val u = cur ?: return toast("Open a file first")
                  val i = Intent(Intent.ACTION_VIEW).setDataAndType(u, mime)
                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                  i.clipData = ClipData.newRawUri(name, u)
                  try { startActivity(Intent.createChooser(i, "Open / edit with")) } catch (e: Exception) { toast("No app found for this file") }
              }

              private fun pin() {
                  val u = cur ?: return toast("Open a file first")
                  if (!ShortcutManagerCompat.isRequestPinShortcutSupported(this)) return toast("Home screen shortcuts not supported on this device")
                  val si = ShortcutInfoCompat.Builder(this, "f" + u.hashCode())
                      .setShortLabel(name)
                      .setIcon(IconCompat.createWithResource(this, android.R.drawable.ic_menu_agenda))
                      .setIntent(Intent(this, MainActivity::class.java).setAction(Intent.ACTION_VIEW).setData(u)
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                      .build()
                  ShortcutManagerCompat.requestPinShortcut(this, si, null)
              }
          }

          class PdfAdapter(private val ctx: android.content.Context, private val uri: Uri) : PrintDocumentAdapter() {
              override fun onLayout(o: PrintAttributes?, n: PrintAttributes?, c: CancellationSignal?, cb: LayoutResultCallback, x: Bundle?) {
                  if (c?.isCanceled == true) { cb.onLayoutCancelled(); return }
                  cb.onLayoutFinished(PrintDocumentInfo.Builder("document.pdf")
                      .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)
                      .setPageCount(PrintDocumentInfo.PAGE_COUNT_UNKNOWN).build(), true)
              }
              override fun onWrite(p: Array<out PageRange>?, d: ParcelFileDescriptor, c: CancellationSignal?, cb: WriteResultCallback) {
                  try {
                      ctx.contentResolver.openInputStream(uri)!!.use { i ->
                          FileOutputStream(d.fileDescriptor).use { o -> i.copyTo(o) }
                      }
                      cb.onWriteFinished(arrayOf(PageRange.ALL_PAGES))
                  } catch (e: Exception) { cb.onWriteFailed(e.message) }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaleem-Viewer-APK
          path: app/build/outputs/apk/debug/*.apk
